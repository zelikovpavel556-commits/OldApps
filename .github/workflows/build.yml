name: Build site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/**/*.txt", "apps/**/*.apk", "build.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rebuild site [skip ci]"
          git push
